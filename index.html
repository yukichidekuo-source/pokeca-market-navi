<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172554">
<meta name="description" content="ポケカ相場ナビ - パック・カード名・レアリティからポケモンカードを検索">
<title>ポケカ相場ナビ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="brand"><span></span>ポケカ相場ナビ</div>
    <h1>ポケカの相場を、<br><em>かんたんチェック。</em></h1>
    <p>パック・カード名・レアリティから検索。カード画像も確認できます。</p>
  </div>
</header>
<main class="wrap">
<section class="search-card">
  <div class="title"><div><small>SEARCH</small><h2>カードを検索</h2></div><b>β版</b></div>
  <label for="setSearch">① パック・セットを選択</label>
  <input id="setSearch" class="full" type="search" placeholder="例：ロケット団、熱風のアリーナ">
  <select id="setSelect" class="full"><option value="">パックを読み込み中…</option></select>
  <div id="setInfo" class="set-info hidden"></div>
  <label for="cardSearch">② カード名・カード番号</label>
  <div class="row"><input id="cardSearch" type="search" placeholder="例：ピカチュウ / 035"><button id="searchBtn">検索</button></div>
  <label for="raritySelect">③ レアリティ</label>
  <select id="raritySelect" class="full"><option value="">すべてのレアリティ</option></select>
  <div class="filter-actions"><button id="clearBtn" class="secondary">条件をクリア</button><span id="resultCount" class="result-count"></span></div>
  <div id="status" class="status">パック情報を読み込んでいます…</div>
  <div id="results" class="results"></div>
</section>
<section>
  <div class="title plain"><div><small>SHOP</small><h2>ショップを探す</h2></div></div>
  <div class="shops">
    <a href="https://magi.camp/" target="_blank" rel="noopener"><i>m</i><div><strong>magi</strong><span>カードの販売・買取</span></div><b>›</b></a>
    <a href="https://www.cardrush-pokemon.jp/" target="_blank" rel="noopener"><i>C</i><div><strong>カードラッシュ</strong><span>ポケカ販売・買取</span></div><b>›</b></a>
  </div>
</section>
<section class="next">
  <div class="title plain"><div><small>ROADMAP</small><h2>次に追加する機能</h2></div></div>
  <div class="grid">
    <article><small>01</small><strong>実相場</strong><p>販売・買取価格を取得して比較</p></article>
    <article><small>02</small><strong>価格推移</strong><p>7日・30日・90日の変化を表示</p></article>
    <article><small>03</small><strong>高騰チェック</strong><p>値上がり・値下がりカードを発見</p></article>
    <article><small>04</small><strong>アフィリエイト</strong><p>購入・買取ページへの導線</p></article>
  </div>
</section>
</main>
<footer>© 2026 ポケカ相場ナビ</footer>
<script src="app.js"></script>
</body>
</html>
